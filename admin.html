<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Chá de Construção</title>
<style>body{font-family:system-ui;margin:0;background:#faf7f3;color:#302923}.wrap{max-width:1000px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #eadfd6;border-radius:18px;padding:20px;margin:18px 0}input{padding:11px;border:1px solid #ddd;border-radius:9px}button{padding:11px 15px;border:0;border-radius:9px;background:#9b6b4a;color:white;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.muted{color:#756b63}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>Painel do Chá de Construção</h1><div class="cards"><div class="box"><span class="muted">Meta</span><h2 id="target">—</h2></div><div class="box"><span class="muted">Arrecadado</span><h2 id="raised">—</h2></div><div class="box"><span class="muted">Progresso</span><h2 id="pct">—</h2></div></div>
<div class="box"><h2>Meta</h2><input id="targetInput" type="number" step=".01"><button onclick="saveTarget()">Salvar meta</button></div>
<div class="box"><h2>Materiais</h2><table><thead><tr><th>Item</th><th>Preço</th><th>Total</th><th>Disponível</th></tr></thead><tbody id="items"></tbody></table></div>
<div class="box"><h2>Últimos pedidos</h2><table><thead><tr><th>Pedido</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead><tbody id="orders"></tbody></table></div>
<script>
const money=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function load(){const d=await (await fetch("/api/admin")).json();document.getElementById("target").textContent=money(d.targetCents);document.getElementById("raised").textContent=money(d.raisedCents);document.getElementById("pct").textContent=d.percent.toFixed(1)+"%";document.getElementById("targetInput").value=(d.targetCents/100).toFixed(2);document.getElementById("items").innerHTML=d.items.map(x=>`<tr><td>${x.name}</td><td>${money(x.priceCents)}</td><td>${x.totalQty}</td><td>${x.remaining}</td></tr>`).join("");document.getElementById("orders").innerHTML=d.orders.map(o=>`<tr><td>${o.id}</td><td>${money(o.total_cents)}</td><td>${o.status}</td><td>${new Date(o.created_at).toLocaleString("pt-BR")}</td></tr>`).join("")}
async function saveTarget(){const cents=Math.round(Number(document.getElementById("targetInput").value)*100);await fetch("/api/admin/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetCents:cents})});load()}load();
</script></div></body></html>
